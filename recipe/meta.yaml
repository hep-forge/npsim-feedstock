{% set versions = {
    "1.6.1": "v1.6.1"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}
{% set tag = versions.get(version, "v" + version) %}

{% set name = environ.get('ANACONDA_PACKAGE', 'npsim')|string|lower %}
{% set root_tag = (root or '')|replace('.', '') %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  git_url: "https://github.com/eic/npsim.git"
  git_rev: {{ tag }}

build:
  number: 0
  string: "root{{ root_tag }}"
  skip: true  # [win]
  # -DUSE_GEOCAD=ON enables src/geocad's ROOT_GENERATE_DICTIONARY(), which
  # installs a precompiled ROOT dictionary cache (lib/*.pcm). conda-build's
  # default prefix-relocation does a naive text substitution on every
  # installed file it doesn't know to skip, which corrupts that binary
  # format. Same fix as root-feedstock/root-plus-feedstock use for the
  # identical artifact.
  ignore_prefix_files:
    - lib/*.pcm
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
    - git
  host:
    # geant is published only under the hep-forge "eic" label -- this
    # feedstock's own .github/workflows/autoupload.yml adds that channel
    # (scripts/templates/autoupload.yml deliberately does not, most
    # feedstocks don't need it) -- dd4hep pulls geant in transitively.
    - root {{ root }}.*
    - dd4hep>=1.18 root{{ root_tag }}
    # DD4hepConfig.cmake does FIND_DEPENDENCY(Boost REQUIRED) at every
    # consumer's own configure time (caught while debugging epic's
    # first build), so Boost headers must be present here too.
    - libboost-devel
    - occt
    - fmt
    # our hep-forge root has ROOT::RHTTP enabled, which makes
    # src/tools/CMakeLists.txt unconditionally build dd_web_display and
    # link it to spdlog::spdlog with no spdlog_FOUND guard.
    - spdlog
  run:
    - root {{ root }}.*
    - dd4hep>=1.18 root{{ root_tag }}
    - occt
    - fmt
    - spdlog
    - python

test:
  commands:
    - test -f "${PREFIX}/bin/npsim"
    - test -f "${PREFIX}/lib/libNPDetPlugins.so"
    - test -f "${PREFIX}/lib/libGeoCad.so"
    - test -f "${PREFIX}/bin/dd_web_display"
    - npsim --help

about:
  home: "https://github.com/eic/npsim"
  dev_url: "https://github.com/eic/npsim"
  license: "NOASSERTION"
  summary: "DD4hep-based simulation plugins, front-end, and related utilities"
  description: |
    npsim (formerly NPDet) provides DD4hep/DDG4 simulation plugins (e.g.
    EIC-specific particle handling and interaction-vertex smearing) and
    the npsim front-end script for running Geant4 simulations against
    an EIC detector description such as epic. Built here against
    hep-forge's own dd4hep/root -- part of hep-forge's EIC Phase 1
    simulation-chain build-out (geant -> g4hepem -> dd4hep -> epic ->
    npsim, plus acts).

extra:
  recipe-maintainers:
    - meiyasan
